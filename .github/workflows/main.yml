name: Q-Med CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint with flake8
        run: |
          pip install flake8
          cd backend
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Test with pytest (placeholder)
        run: |
          echo "Running backend tests..."
          # cd backend && pytest

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Lint
        run: |
          cd frontend
          npm run lint --if-present
      - name: Build
        run: |
          cd frontend
          npm run build

  release:
    needs: [backend-test, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.0-${{ github.run_number }}"
          echo "Attempting to create GitHub release: $TAG"
          for i in 1 2 3; do
            echo "Attempt $i..."
            if gh release create "$TAG" --title "Release $TAG" --notes "Automated production release." --target "${{ github.sha }}"; then
              echo "Release $TAG created successfully."
              exit 0
            fi
            echo "Release creation failed. Retrying in 10 seconds..."
            sleep 10
          done
          echo "GitHub Release API unavailable at this time. Continuing build without blocking CI/CD."



