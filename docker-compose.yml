version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    # Exposes port 80 internally
    networks:
      - qmed-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - qmed_uploads:/app/uploads
      - qmed_logs:/app/logs
    networks:
      - qmed-network

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - qmed-network

volumes:
  qmed_uploads:
  qmed_logs:

networks:
  qmed-network:
    driver: bridge
